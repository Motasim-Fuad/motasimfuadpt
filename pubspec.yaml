name: flutter_portfolio
description: A professional Flutter/Mobile Developer Portfolio with Firebase
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.0.0

  # Animations
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2

  # UI & Fonts
  google_fonts: ^6.2.1
  font_awesome_flutter: ^11.0.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1

  # State Management
  get: ^4.6.6

  # Utils
  url_launcher: ^6.3.0
  intl: ^0.19.0
  flutter_markdown: ^0.7.4+3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
